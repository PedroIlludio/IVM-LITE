<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do mapa 2D</title>
<!--
  Diagnóstico do mapa do entorno, SEM DEPENDÊNCIA NENHUMA.

  As duas versões anteriores desta página falharam por culpa dela mesma: a
  primeira carregou o MapLibre por `<script src>` (a v6 não publica build
  global — 404), a segunda por `import` ESM (se o módulo não resolve, o script
  inteiro morre calado e a tela fica vazia — foi o "não dá resposta").

  Esta não importa nada. Testa só o que decide o caso, com JavaScript puro:

  1. o aparelho alcança o servidor de tiles?      (já provado que sim: HTTP 200)
  2. o aparelho concede contexto WebGL?           ← a hipótese viva
  3. quantos contextos simultâneos ele aguenta?   ← o Cesium já ocupa um

  Se o item 3 devolver 1, está explicado: a vitrine tem a cena 3D e o mapa
  disputando o único contexto do aparelho, e quem chega depois não monta.
-->
<style>
  body { margin:0; padding:16px; font:14px/1.6 system-ui, sans-serif; background:#f5f5f5; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:#666; font-size:12px; }
  ul { margin:0; padding:0; list-style:none; font:12px/1.8 ui-monospace, monospace; }
  li { border-bottom:1px solid #e5e5e5; padding:2px 0; }
  li.ok   { color:#15803d; }
  li.erro { color:#b91c1c; font-weight:600; }
  li.tit  { margin-top:14px; font-weight:700; color:#111; border:0; }
</style>
</head>
<body>
  <h1>Teste do mapa 2D</h1>
  <p class="sub">Isolado do aplicativo — sem React, sem bundle, sem CDN.</p>
  <ul id="saida"></ul>

<script>
/* Sem `type="module"`: script clássico não depende de resolução de import e
   não morre calado. Qualquer erro é capturado e escrito na tela. */
var saida = document.getElementById("saida");
function log(txt, cls) {
  var li = document.createElement("li");
  li.textContent = txt;
  if (cls) li.className = cls;
  saida.appendChild(li);
}
window.onerror = function (msg, arq, lin) {
  log("ERRO JS: " + msg + " (" + arq + ":" + lin + ")", "erro");
};

log("AMBIENTE", "tit");
log("origem: " + location.origin);
log("protocolo: " + location.protocol);
log("navegador: " + navigator.userAgent.slice(0, 90));
log("nucleos: " + (navigator.hardwareConcurrency || "?") +
    " | memoria: " + (navigator.deviceMemory || "?") + " GB");
log("tela: " + screen.width + "x" + screen.height + " @" + (window.devicePixelRatio || 1) + "x");

/* --- 1. WebGL existe? ---------------------------------------------------- */
log("WEBGL", "tit");
var gl = null;
try {
  var c = document.createElement("canvas");
  gl = c.getContext("webgl2") || c.getContext("webgl") || c.getContext("experimental-webgl");
  if (gl) {
    log("contexto: OK (" + gl.getParameter(gl.VERSION) + ")", "ok");
    var dbg = gl.getExtension("WEBGL_debug_renderer_info");
    if (dbg) log("GPU: " + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
    log("textura maxima: " + gl.getParameter(gl.MAX_TEXTURE_SIZE) + "px");
  } else {
    log("contexto: INDISPONIVEL — nenhum mapa 3D ou 2D roda aqui", "erro");
  }
} catch (e) {
  log("WebGL falhou: " + e.message, "erro");
}

/* --- 2. Quantos contextos ao mesmo tempo? -------------------------------- */
/* É o teste que importa: na vitrine o Cesium segura um, e o MapLibre precisa
   de outro. Se o limite for baixo, o segundo simplesmente não nasce. */
log("CONTEXTOS SIMULTANEOS", "tit");
try {
  var vivos = [];
  for (var i = 0; i < 16; i++) {
    var cv = document.createElement("canvas");
    cv.width = cv.height = 32;
    var ctx = cv.getContext("webgl2") || cv.getContext("webgl");
    if (!ctx) break;
    vivos.push(ctx);
  }
  log("conseguiu abrir: " + vivos.length + " contexto(s)", vivos.length >= 2 ? "ok" : "erro");
  if (vivos.length < 2) {
    log("=> CAUSA PROVAVEL: a cena 3D ocupa o unico contexto e o mapa nao monta", "erro");
  }
} catch (e) {
  log("falhou ao medir: " + e.message, "erro");
}

/* --- 3. O servidor de tiles responde? ------------------------------------ */
log("SERVIDOR DE TILES", "tit");
log("consultando tiles.openfreemap.org ...");
fetch("https://tiles.openfreemap.org/styles/positron", { cache: "no-store" })
  .then(function (r) { log("estilo: HTTP " + r.status, r.ok ? "ok" : "erro"); return r.json(); })
  .then(function (j) {
    log("camadas no estilo: " + (j.layers ? j.layers.length : 0), "ok");
    var url = j.sources && j.sources.openmaptiles && j.sources.openmaptiles.url;
    if (!url) { log("estilo sem fonte de tiles", "erro"); return; }
    log("consultando a fonte de tiles ...");
    return fetch(url, { cache: "no-store" }).then(function (r2) {
      log("fonte: HTTP " + r2.status, r2.ok ? "ok" : "erro");
      return r2.json();
    }).then(function (tj) {
      log("tiles em: " + ((tj.tiles && tj.tiles[0]) || "?").slice(0, 70), "ok");
      log("CONCLUSAO: a rede esta inteira; o problema e o aparelho", "ok");
    });
  })
  .catch(function (e) { log("rede FALHOU: " + e.message, "erro"); });
</script>
</body>
</html>
